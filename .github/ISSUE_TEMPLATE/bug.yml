name: Bug or poor skill output
description: Report a reproducible setup problem or a paywall decision that needs improvement.
body:
  - type: textarea
    id: context
    attributes:
      label: Environment and request
      description: Agent, version/model if known, OS, framework, and your exact prompt. Remove secrets and private data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include reproducible steps and a redacted output or authorized screenshot.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: What you verified
      description: For example, source review, rendered preview, or store-sandbox test.
