name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check.py
      - run: python -m unittest discover -s tests -v
  swift-sample:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Type-check SwiftUI sample against the iOS simulator SDK
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          xcrun swiftc -typecheck -sdk "$SDK" -target "${ARCH}-apple-ios16.0-simulator" examples/swiftui/PaywallView.swift
