name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check.py
      - run: python -m unittest discover -s tests -v
  swift-sample:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Type-check SwiftUI sample against the iOS simulator SDK
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          xcrun swiftc -typecheck -sdk "$SDK" -target "${ARCH}-apple-ios16.0-simulator" examples/swiftui/PaywallView.swift

  android-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew --no-daemon :app:assembleDebug
        working-directory: examples/android

  flutter-sample:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
