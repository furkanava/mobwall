<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
<title id="title">A two-screen Grove paywall candidate</title>
<desc id="desc">Original specification: first explain value and compare Free with Plus, then show subscription plans. Fictional example; no measured conversion claim or native runtime capture.</desc>
