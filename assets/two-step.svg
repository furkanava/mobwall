<text x="60" y="134" font-size="51" font-weight="700" letter-spacing="-1.8">Explain the value. Then make the offer.</text>
<text x="62" y="173" font-size="20" fill="#546258">Two purposeful screens + an honest Free / Plus comparison. A candidate to test, not a guaranteed winner.</text>
